[project]
name = "ayrim"
version = "0.1.0"
description = "PDF renk ayrımı önizleyicisi (CMYK + spot), Ghostscript tiffsep tabanlı"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
    "pikepdf>=9.0",
    "pyside6>=6.7",
]

[project.scripts]
ayrim = "ayrim.ui.app:main"

[dependency-groups]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["uv_build>=0.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
