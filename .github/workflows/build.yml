name: Derleme

# Her gönderimde testler çalışır ve üç sistem için paket üretilir.
# pyproject.toml'daki sürüm numarası için henüz bir etiket yoksa (ör. 0.1.2 → v0.1.2),
# ana dala yapılan gönderimde etiket oluşturulur ve paketler bir sürüm olarak yayınlanır.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Sürüm
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # mevcut etiketleri görmek için
      - id: v
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] \
             && [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ] \
             && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version yayınlanacak"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version zaten var ya da ana dal değil; yalnızca derleme"
          fi

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            artifact: dist/Ayrim-macos-arm64.zip
          - name: Windows
            os: windows-latest
            artifact: dist/Ayrim-windows-x64.zip
          - name: Linux
            os: ubuntu-latest
            artifact: dist/Ayrim-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Ghostscript kur (macOS)
        if: runner.os == 'macOS'
        run: brew install ghostscript

      # Ghostscript kurucusu (Chocolatey ile de, doğrudan /S ile de) CI'da takılıp zaman aşımına
      # uğruyor. Kurucu çalıştırılmıyor: NSIS paketi 7-Zip ile, kurulumun koyacağı yere açılıyor.
      - name: Ghostscript kur (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        env:
          GS_URL: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/gs10080w64.exe
          GS_DIR: C:\Program Files\gs\gs10.08.0
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "gs-setup.exe"
          for ($i = 1; $i -le 4; $i++) {
            try { Invoke-WebRequest $env:GS_URL -OutFile $installer; break }
            catch { if ($i -eq 4) { throw }; Start-Sleep -Seconds (2 * $i) }
          }
          7z x $installer "-o$env:GS_DIR" -y -bd | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Ghostscript paketi açılamadı ($LASTEXITCODE)" }
          $bin = Join-Path $env:GS_DIR "bin"
          $bin >> $env:GITHUB_PATH
          & (Join-Path $bin "gswin64c.exe") --version

      - name: Ghostscript ve Qt kütüphanelerini kur (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Testler
        run: |
          uv sync
          uv run pytest -q

      - name: Paketle (macOS)
        if: runner.os == 'macOS'
        run: ./packaging/build_mac.sh

      - name: Paketle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Paketle (Linux)
        if: runner.os == 'Linux'
        run: |
          uv sync --group build
          uv run pyinstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/Ayrim.spec
          tar -czf dist/Ayrim-linux-x64.tar.gz -C dist Ayrim

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: paketler
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ayrım ${{ needs.version.outputs.version }}
          files: paketler/*
          generate_release_notes: true
