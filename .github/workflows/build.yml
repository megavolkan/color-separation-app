name: Derleme

# Her gönderimde testler çalışır ve üç sistem için paket üretilir.
# "v" ile başlayan bir etiket (ör. v0.2.0) gönderilince paketler bir sürüm olarak yayınlanır.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            artifact: dist/Ayrim-macos-arm64.zip
          - name: Windows
            os: windows-latest
            artifact: dist/Ayrim-windows-x64.zip
          - name: Linux
            os: ubuntu-latest
            artifact: dist/Ayrim-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Ghostscript kur (macOS)
        if: runner.os == 'macOS'
        run: brew install ghostscript

      - name: Ghostscript kur (Windows)
        if: runner.os == 'Windows'
        run: choco install ghostscript --no-progress -y

      - name: Ghostscript ve Qt kütüphanelerini kur (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Testler
        run: |
          uv sync
          uv run pytest -q

      - name: Paketle (macOS)
        if: runner.os == 'macOS'
        run: ./packaging/build_mac.sh

      - name: Paketle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Paketle (Linux)
        if: runner.os == 'Linux'
        run: |
          uv sync --group build
          uv run pyinstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/Ayrim.spec
          tar -czf dist/Ayrim-linux-x64.tar.gz -C dist Ayrim

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paketler
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: paketler/*
          generate_release_notes: true
